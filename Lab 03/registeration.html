<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="darkmode_registeration.css">
    <title>Registeration</title>
</head>

<body>
    <header class="bg-white text-gray-800 shadow-md">
        <nav class="nav-container">
            <div class="logo font-bold text-blue-600">Self Study System</div>
            <ul class="nav-links">
                <li><a href="index.html" class="hover:text-blue-600">Home</a></li>
                <li><a href="index.html" class="hover:text-blue-600">To-Do List</a></li>
                <li><a href="index.html" class="hover:text-blue-600">Resourses</a></li>
                <li><a href="index.html" class="hover:text-blue-600">Contact</a></li>
                <li><a href="#registeration" class="hover:text-blue-600">Registeration</a></li>
                
            </ul>
            <button id="theme-toggle" class="bg-blue-600 text-white hover:bg-blue-700">
                Change Theme
            </button>
        </nav>
    </header>   
    <section id="registration" class="py-16 bg-gradient-to-r from-blue-50 to-indigo-50">

        <div class="max-w-5xl mx-auto px-6">

            <h2 class="text-4xl font-bold text-center text-gray-900 mb-3">
                Student Registration
            </h2>

            <p class="text-center text-gray-600 mb-10">
                Register yourself to access the Self Study System.</p>

            <form id="registration-form" class="bg-white rounded-xl shadow-lg p-8 grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Full Name
                    </label>

                    <input type="text" id="fullName" placeholder="Arnav Deore"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input type="email" id="regEmail" placeholder="anything@gmail.com"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input type="password" id="regPassword" placeholder="Password"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Mobile Number
                    </label>

                    <input type="tel" id="mobile" placeholder="xxxxxxxxxx"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Age
                    </label>

                    <input type="number" id="age"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Date of Birth
                    </label>

                    <input type="date" id="dob"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Gender
                    </label>
                    <div class="flex gap-5">

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="radio" name="gender" value="Other">
                            Other
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Course
                    </label>

                    <select id="course"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <option>Select Course</option>
                        <option>MCA</option>
                        <option>MBA</option>
                        <option>BBA</option>
                        <option>BCA</option>

                    </select>
                </div>
                <div class="md:col-span-2">

                    <label class="block font-medium text-gray-700 mb-2">
                        Skills
                    </label>

                    <div class="flex flex-wrap gap-5">

                        <label class="flex items-center gap-2">
                            <input type="checkbox" value="HTML">
                            HTML
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="checkbox" value="CSS">
                            CSS
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="checkbox" value="JavaScript">
                            JavaScript
                        </label>

                        <label class="flex items-center gap-2">
                            <input type="checkbox" value="Python">
                            Python
                        </label>

                    </div>

                </div>
                <div class="md:col-span-2">

                    <label class="block font-medium text-gray-700 mb-2">
                        Address
                    </label>

                    <textarea id="address" rows="4"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Enter Address"></textarea>

                </div>
                <div class="md:col-span-2">

                    <label class="block font-medium text-gray-700 mb-2">
                        Upload Photo
                    </label>

                    <input type="file" id="photo" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50">

                </div>
                <div class="md:col-span-2 flex justify-center gap-4">

                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg transition">

                        Register

                    </button>

                    <button type="reset"
                        class="bg-gray-600 hover:bg-gray-700 text-white px-8 py-3 rounded-lg transition">

                        Reset

                    </button>

                </div>

            </form>
            <div id="student-card" class="mt-10"></div>

        </div>

    </section>

<script>
const themeButton = document.getElementById("theme-toggle");
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-mode");
}
themeButton.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        localStorage.setItem("theme","dark");
    }else{
        localStorage.setItem("theme","light");
    }

});
</script>
 <script src="validation.js"></script>
</body>

</html>
