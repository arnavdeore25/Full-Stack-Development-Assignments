<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="darkmode_registeration.css">
    <title>Registration</title>
</head>

<body>
    <header class="bg-white text-gray-800 shadow-md">
        <nav class="nav-container">
            <div class="logo font-bold text-blue-600">Self Study System</div>
            <ul class="nav-links">
                <li><a href="#hero" class="hover:text-blue-600">Home</a></li>
                <li><a href="#todo" class="hover:text-blue-600">To-Do List</a></li>
                <li><a href="#resources" class="hover:text-blue-600">Resourses</a></li>
                <li><a href="#contact" class="hover:text-blue-600">Contact</a></li>
            </ul>
            <button id="theme-toggle" class="bg-blue-600 text-white hover:bg-blue-700">Change Theme</button>
        </nav>
    </header>

    <h1 class="text-3xl font-bold text-center text-blue-700 mt-8 mb-6">🎓 Student Manager</h1>

    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-6xl mx-auto mb-8">
        <form id="studentForm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                <div>
                    <label class="font-semibold block mb-2">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter full name">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Password</label>
                    <input type="password" id="password" placeholder="Enter password">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Age</label>
                    <input type="number" id="age" placeholder="Enter age">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Date of Birth</label>
                    <input type="date" id="dob">
                </div>

                <div>
                    <label class="font-semibold block mb-2">Gender</label>
                    <div class="gender-container">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div>
                    <label class="font-semibold block mb-2">Course</label>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>
                    </select>
                </div>
            </div>

            <div class="mt-7">
                <label class="font-semibold block mb-3">Skills</label>
                <div class="skills-container">
                    <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
                    <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
                    <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" name="skills" value="Python"> Python</label>
                </div>
            </div>

            <div class="mt-7">
                <label class="font-semibold block mb-2">Address</label>
                <textarea id="address" rows="4" placeholder="Enter address"></textarea>
            </div>

            <div class="flex gap-3 mt-7">
                <button type="submit" id="submitBtn" class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">Add Student</button>
                <button type="button" id="cancelBtn" class="bg-gray-500 text-white px-6 py-3 rounded hover:bg-gray-600 hidden">Cancel Edit</button>
            </div>
        </form>
    </div>

    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-6xl mx-auto mb-8">
        <h2 class="text-xl font-bold mb-5">📋 Student List</h2>
        <div id="studentList" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </div>

    <script>
        let students = [];
        let editingId = null;

        const form = document.getElementById("studentForm");
        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const mobileInput = document.getElementById("mobile");
        const ageInput = document.getElementById("age");
        const dobInput = document.getElementById("dob");
        const courseInput = document.getElementById("course");
        const addressInput = document.getElementById("address");
        const studentList = document.getElementById("studentList");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const genderElement = document.querySelector('input[name="gender"]:checked');
            const gender = genderElement ? genderElement.value : "";
            const skillElements = document.querySelectorAll('input[name="skills"]:checked');
            const skills = Array.from(skillElements).map(skill => skill.value);

            if (!fullNameInput.value.trim() ||
                !emailInput.value.trim() ||
                !passwordInput.value.trim() ||
                !mobileInput.value.trim() ||
                !ageInput.value ||
                !dobInput.value ||
                !gender ||
                !courseInput.value ||
                skills.length === 0 ||
                !addressInput.value.trim()) {
                alert("Please fill all fields!");
                return;
            }

            if (editingId !== null) {
                const student = students.find(student => student.id === editingId);

                if (student) {
                    student.fullName = fullNameInput.value.trim();
                    student.email = emailInput.value.trim();
                    student.password = passwordInput.value.trim();
                    student.mobile = mobileInput.value.trim();
                    student.age = ageInput.value;
                    student.dob = dobInput.value;
                    student.gender = gender;
                    student.course = courseInput.value;
                    student.skills = skills;
                    student.address = addressInput.value.trim();
                }

                alert("Student details updated successfully!");
                editingId = null;
                submitBtn.textContent = "Add Student";
                cancelBtn.classList.add("hidden");
            } else {
                const student = {
                    id: Date.now(),
                    fullName: fullNameInput.value.trim(),
                    email: emailInput.value.trim(),
                    password: passwordInput.value.trim(),
                    mobile: mobileInput.value.trim(),
                    age: ageInput.value,
                    dob: dobInput.value,
                    gender: gender,
                    course: courseInput.value,
                    skills: skills,
                    address: addressInput.value.trim()
                };

                students.push(student);
            }

            renderStudents();
            resetForm();
        });

        function renderStudents() {
            studentList.innerHTML = "";

            if (students.length === 0) {
                studentList.innerHTML = `<p class="text-gray-500">No students added yet.</p>`;
                return;
            }

            students.forEach(student => {
                const card = document.createElement("div");
                card.className = "border rounded-lg p-5 shadow-sm bg-gray-50";

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-blue-700">${student.fullName}</h3>
                            <p class="text-gray-600">${student.course}</p>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="editStudent(${student.id})" class="bg-yellow-500 text-white px-3 py-2 rounded hover:bg-yellow-600">Edit</button>
                            <button onclick="deleteStudent(${student.id})" class="bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600">Delete</button>
                        </div>
                    </div>

                    <div class="space-y-2 text-sm">
                        <p><strong>Email:</strong> ${student.email}</p>
                        <p><strong>Password:</strong> ••••••••</p>
                        <p><strong>Mobile:</strong> ${student.mobile}</p>
                        <p><strong>Age:</strong> ${student.age}</p>
                        <p><strong>Date of Birth:</strong> ${student.dob}</p>
                        <p><strong>Gender:</strong> ${student.gender}</p>
                        <p><strong>Course:</strong> ${student.course}</p>
                        <p><strong>Skills:</strong> ${student.skills.join(", ")}</p>
                        <p><strong>Address:</strong> ${student.address}</p>
                    </div>
                `;

                studentList.appendChild(card);
            });
        }


//edit
        function editStudent(id) {
            const student = students.find(student => student.id === id);

            if (!student) {
                return;
            }

            fullNameInput.value = student.fullName;
            emailInput.value = student.email;
            passwordInput.value = student.password;
            mobileInput.value = student.mobile;
            ageInput.value = student.age;
            dobInput.value = student.dob;
            courseInput.value = student.course;
            addressInput.value = student.address;

            document.querySelectorAll('input[name="gender"]').forEach(radio => {
                radio.checked = radio.value === student.gender;
            });

            document.querySelectorAll('input[name="skills"]').forEach(checkbox => {
                checkbox.checked = student.skills.includes(checkbox.value);
            });

            editingId = id;
            submitBtn.textContent = "Update Student";
            cancelBtn.classList.remove("hidden");

            form.scrollIntoView({ behavior: "smooth" });
        }

//delete
        function deleteStudent(id) {
            const confirmDelete = confirm("Are you sure you want to delete this student?");

            if (!confirmDelete) {
                return;
            }

            students = students.filter(student => student.id !== id);

            if (editingId === id) {
                editingId = null;
                resetForm();
            }

            renderStudents();
        }

        function resetForm() {
            form.reset();
            editingId = null;
            submitBtn.textContent = "Add Student";
            cancelBtn.classList.add("hidden");
        }

        cancelBtn.addEventListener("click", function() {
            resetForm();
        });

        renderStudents();

        const themeButton = document.getElementById("theme-toggle");

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }

        themeButton.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        });
    </script>

    <script src="validation.js"></script>
</body>
</html>
